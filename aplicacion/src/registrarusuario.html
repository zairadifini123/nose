<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="./recursos/estilos/estilos.css">
</head>

<body>
    <header class="encabezado-principal">
        <a href="index.html">
            <img src="./recursos/imagenes/logo.svg" alt="">
        </a>
        <nav class="vinculos">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="buscar.html">Buscar</a></li> 
                <li><a href="editar.html">Editar</a></li> 
                <li><a href="registrarusuario.html">Registrar Usuario</a></li>
                <li><a href="chat.html">Chat</a></li>
            </ul>
        </nav>
    </header>
    <main class="contenido-principal">
        <h2>Registro de Usuario</h2>
        <section class="registrar-usuario">
            <p>Por favor, complete el siguiente formulario para registrarse:</p>
            <form action="./registrarusuario.html" method="POST">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>

                <label for="nombre_usuario">Nombre de Usuario:</label>
                <input type="text" id="nombre_usuario" name="nombre_usuario" required>

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>

                <label for="genero">Género:</label>
                <select id="genero" name="genero" required>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro</option>
                </select>

                <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>

                <label for="foto_perfil">Foto de Perfil:</label>
                <input type="file" id="foto_perfil" name="foto_perfil" accept="image/*">

                <button type="submit">Registrarse</button>
            </form>
        </section>
    </main>

    <footer class="pie-principal">
        <p>&copy; Red Social. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
